services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: notch
      POSTGRES_PASSWORD: notch
      POSTGRES_DB: notch
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notch -d notch"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres:
